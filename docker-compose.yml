services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mr
      POSTGRES_PASSWORD: mr
      POSTGRES_DB: mediaresearch
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mr -d mediaresearch"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
