<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Мониторинг{% endblock %} · mediaresearch</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect x='1' y='8' width='3' height='7' rx='1' fill='%23e34948'/><rect x='6.5' y='4' width='3' height='11' rx='1' fill='%238f8e86'/><rect x='12' y='1' width='3' height='14' rx='1' fill='%232a78d6'/></svg>">
  <link rel="stylesheet" href="{{ url_for('static', path='vendor/pico.min.css') }}">
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="{{ url_for('static', path='vendor/htmx.min.js') }}" defer></script>
</head>
<body>
  <header class="container">
    <nav>
      <ul><li><strong>mediaresearch</strong></li></ul>
      <ul>
        <li><a href="/" {% if request.url.path == '/' %}aria-current="page"{% endif %}>Лента</a></li>
        <li><a href="/dashboard" {% if request.url.path == '/dashboard' %}aria-current="page"{% endif %}>Дашборд</a></li>
      </ul>
    </nav>
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
