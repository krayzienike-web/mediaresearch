# Бренды для мониторинга. Примеры ниже замените на свои.
#
# search — строки для поисковых источников (Google News, поиск ВК).
#          Источник сам ищет по ним, поэтому держите их короткими.
# match  — правила, по которым мы сами проверяем каждый текст:
#   include: хотя бы одно должно сработать
#   exclude: если сработало хоть одно, упоминание отбрасывается
#
# Синтаксис выражений:
#   сбербанк      — слово во всех формах (сбербанка, сбербанку...)
#   сбер онлайн   — фраза, слова идут подряд
#   сбербанк*     — любое слово, начинающееся на «сбербанк»

brands:
  - slug: sber
    name: Сбер
    search:
      - Сбербанк
      - Сбер
    match:
      include:
        - сбербанк
        - сбер
        - sberbank

  # Омоним: «магнит» — и сеть магазинов, и просто магнит.
  # Исключения отсекают очевидный мусор, остальное будем чистить разметкой.
  - slug: magnit
    name: Магнит
    search:
      - сеть Магнит
      - ПАО Магнит
    match:
      include:
        - магнит
      exclude:
        - магнит на холодильник
        - неодимовый магнит
        - сувенирный магнит
