[project]
name = "mediaresearch"
version = "0.1.0"
description = "Мониторинг упоминаний брендов в СМИ и соцсетях"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.12",
    "feedparser>=6.0",
    "httpx>=0.27",
    "lxml>=5.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
]

[project.scripts]
mr = "mediaresearch.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
