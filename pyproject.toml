[project]
name = "mediaresearch"
version = "0.1.0"
description = "Мониторинг упоминаний брендов в СМИ и соцсетях"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "beautifulsoup4>=4.12",
    "fastapi>=0.161.1",
    "feedparser>=6.0",
    "httpx>=0.27",
    "jinja2>=3.1.6",
    "lxml>=5.0",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.4",
    "pymorphy3>=2.0",
    "pymorphy3-dicts-ru>=2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0",
    "rich>=15.0.0",
    "sqlalchemy>=2.0",
    "typer>=0.12",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
mr = "mediaresearch.cli:app"


[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]
# Модель тональности. Ставится по умолчанию; без неё: uv sync --no-group ml
ml = [
    "torch>=2.4",
    "transformers>=4.44",
]

[tool.uv]
default-groups = ["dev", "ml"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
